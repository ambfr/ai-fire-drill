AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Fire Drill — commit regression analyzer backend (FastAPI + Mangum)

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key, passed at deploy time, not stored in this file
  GithubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional GitHub token for higher API rate limits and private repos
  GroqModel:
    Type: String
    Default: openai/gpt-oss-120b
    AllowedValues:
      - openai/gpt-oss-120b
      - llama-3.3-70b-versatile
      - llama-3.1-8b-instant
    Description: Groq model used for the regression analysis (non-secret)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 120
    MemorySize: 512

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ai-fire-drill-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref IncidentsTable
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL: !Ref GroqModel
          GITHUB_TOKEN: !Ref GithubToken
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref IncidentsTable }
      Events:
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"